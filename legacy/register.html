<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Placement Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<div class="register-container">

    <div class="register-box">

        <div class="register-header">
            <i class="fa-solid fa-graduation-cap brand-icon"></i>
            <h1>Smart Placement Assistant</h1>
            <p>Create your account & accelerate your career 🚀</p>
        </div>

        <!-- Role Toggle Tabs -->
        <div class="role-selector">
            <button type="button" class="role-tab active" id="tabStudent" onclick="switchRole('student')">
                <i class="fa-solid fa-user-graduate"></i> Student
            </button>
            <button type="button" class="role-tab" id="tabCompany" onclick="switchRole('company')">
                <i class="fa-solid fa-building"></i> Company / Recruiter
            </button>
        </div>

        <form id="registerForm">
            <input type="hidden" id="selectedRole" value="student">

            <!-- Common Fields -->
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password (Min 6 characters)" minlength="6" required>
            </div>

            <!-- Student-Specific Section -->
            <div id="studentFields" class="role-fields-wrap">
                <div class="input-box">
                    <i class="fa-solid fa-building-columns"></i>
                    <input type="text" id="college" placeholder="College / University Name">
                </div>
                <div class="input-row">
                    <div class="input-box">
                        <i class="fa-solid fa-code-branch"></i>
                        <input type="text" id="branch" placeholder="Branch (e.g. CSE, IT)">
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="text" id="graduationYear" placeholder="Grad Year (e.g. 2026)">
                    </div>
                </div>
            </div>

            <!-- Company-Specific Section -->
            <div id="companyFields" class="role-fields-wrap" style="display:none;">
                <div class="input-box">
                    <i class="fa-solid fa-briefcase"></i>
                    <input type="text" id="companyName" placeholder="Company / Organization Name">
                </div>
                <div class="input-row">
                    <div class="input-box">
                        <i class="fa-solid fa-industry"></i>
                        <input type="text" id="industry" placeholder="Industry (e.g. IT, FinTech)">
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="location" placeholder="Hiring Location">
                    </div>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-globe"></i>
                    <input type="url" id="website" placeholder="Company Website (https://...)">
                </div>
            </div>

            <button type="submit" class="register-btn" id="registerSubmitBtn">
                <i class="fa-solid fa-user-plus"></i> Create Student Account
            </button>

        </form>

        <p class="register-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <div class="back-home-wrap">
            <a href="index.html"><i class="fa-solid fa-house"></i> Back to Homepage</a>
        </div>

    </div>

</div>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>

</html>
